<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Qwerty Academy</title>
<meta name="description" content="Get in touch with Qwerty Academy. Send us a question or report a problem and we will reply by email.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="images/favicon-180.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" href="images/favicon.ico" sizes="any">
</head>
<body class="contact-page">

<header class="contact-topbar">
  <div class="site-logo"><a href="index.html"><img src="images/logo-720.webp" alt="Qwerty Academy" width="720" height="131"></a></div>
</header>

<main class="contact-main">
  <h1 class="contact-title">Contact Us</h1>

  <form class="contact-form" id="contactForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" required>

    <label for="message">Describe your issue</label>
    <textarea id="message" name="message" rows="6" placeholder="Let us know what your issue is." required></textarea>

    <button type="submit" class="contact-submit">SUBMIT</button>
    <p class="form-status" id="formStatus" role="status"></p>
  </form>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="logo">QWERTY ACADEMY</div>
      <div class="footer-social">
        <a class="x-link" href="coming-soon.html" aria-label="X (Twitter)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231L18.244 2.25Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/>
          </svg>
        </a>
        <a class="tg-link" href="coming-soon.html" aria-label="Telegram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.94 4.04 18.9 19.36c-.23 1.02-.83 1.27-1.68.79l-4.65-3.43-2.24 2.16c-.25.25-.46.46-.94.46l.33-4.73 8.6-7.77c.37-.33-.08-.52-.58-.19L7.1 13.34l-4.58-1.43c-1-.31-1.02-1 .21-1.48L20.65 2.6c.83-.31 1.55.19 1.29 1.44Z"/>
          </svg>
        </a>
      </div>
    </div>
    <nav class="footer-links" aria-label="Footer links">
      <a href="coming-soon.html">About Us</a>
      <a href="contact.html" class="is-current">Contact Us</a>
      <a href="coming-soon.html">Careers</a>
    </nav>
  </div>
  <hr class="footer-divider">
  <p class="footer-copy">Copyright © 2026 Qwerty Academy. All rights reserved.</p>
</footer>

<!-- ===== EmailJS: paste your three values below ===== -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  const PUBLIC_KEY  = "MJ2FT_RaTyeyWzsZu";
  const SERVICE_ID  = "service_uxjqlub";
  const TEMPLATE_ID = "template_y37keac";

  const form   = document.getElementById('contactForm');
  const btn    = form.querySelector('.contact-submit');
  const status = document.getElementById('formStatus');

  if (typeof emailjs === 'undefined') {
    // EmailJS script was blocked or failed to load
    btn.disabled = true;
    status.textContent = 'Sorry, the contact form is not available right now. Please try again later.';
    status.className = 'form-status err';
  } else {
    emailjs.init({ publicKey: PUBLIC_KEY });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'SENDING...';
    status.textContent = '';
    status.className = 'form-status';

    emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, form).then(
      function () {
        btn.textContent = 'SUBMIT';
        btn.disabled = false;
        form.reset();
        status.textContent = 'Thanks! Your message has been sent.';
        status.className = 'form-status ok';
      },
      function (error) {
        btn.textContent = 'SUBMIT';
        btn.disabled = false;
        status.textContent = 'Sorry, it did not send. Please try again.';
        status.className = 'form-status err';
        console.log('EmailJS error:', error);
      }
    );
  });
</script>
</body>
</html>
