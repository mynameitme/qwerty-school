<header class="contact-topbar">
  <div class="site-logo"><a href="index.html"><img src="images/logo-720.webp" alt="Qwerty Academy" width="720" height="131"></a></div>
</header>

<main class="lesson-main">
  <p class="lesson-kicker">📖 English</p>

  <div>
    <div class="lesson-list" id="lessonList"></div>

      <button class="cta quiz-next" id="quizNext" hidden>Next →</button>
    </section>

    <section class="quiz-result" id="quizResult" hidden>
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="result-btns">
        <button class="cta" id="retryBtn">Try again</button>
        <button class="cta cta-outline" id="backBtn">All quizzes</button>
      </div>
    </section>
  </div>

</main>
